pre-commit:
  parallel: false
  jobs:
    - name: dependency changes (orchestrator only)
      run: bun scripts/guard-deps.ts
    - name: no gate-proof samples
      run: "! git diff --cached --name-only | grep -q __gate_sample"
    - name: biome format
      glob: "*.{ts,tsx,js,json}"
      run: bunx biome format --error-on-warnings --no-errors-on-unmatched {staged_files}
    - name: eslint
      glob: "{packages,e2e,spike,scripts}/**/*.{ts,tsx}"
      run: bunx eslint --cache --cache-location node_modules/.cache/eslint/ --max-warnings 0 {staged_files}
pre-push:
  jobs:
    - name: typecheck
      run: bun run typecheck
    - name: coverage
      # Runs the end-to-end suite with coverage: at most 5% of lines uncovered, and the lines this
      # push adds must be covered too. Code that no end-to-end test runs does not get pushed.
      # GIT_* is cleared so tests that create their own git repos cannot touch this one.
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE -u GIT_COMMON_DIR -u GIT_PREFIX bun run test:coverage
