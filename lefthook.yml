pre-commit:
  parallel: false
  jobs:
    - name: biome format
      glob: "*.{ts,tsx,js,json}"
      run: bunx biome format --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: eslint
      glob: "{packages,e2e,spike,scripts}/**/*.{ts,tsx}"
      run: bunx eslint --max-warnings 0 {staged_files}
pre-push:
  jobs:
    - name: typecheck
      run: bun run typecheck
