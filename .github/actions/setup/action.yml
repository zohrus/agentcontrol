name: setup
description: Bun, dependency cache, install, and (optionally) the Chromium the browser tests drive.
inputs:
  browsers:
    description: "Install Playwright's Chromium: 'true' or 'false'"
    default: "false"
  ssh:
    description: "Install the OpenSSH server the ssh workspace tests start a private copy of: 'true' or 'false'"
    default: "false"
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.4
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
    - run: bun install --frozen-lockfile
      shell: bash
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.browsers == 'true'
      id: browsers
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
    # Run from e2e/ so bunx uses the playwright pinned in the lockfile. From the repo root bunx
    # downloads the latest one, whose Chromium revision is not the one the tests launch.
    - run: bunx playwright install --with-deps chromium
      if: inputs.browsers == 'true' && steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      working-directory: e2e
    - run: bunx playwright install-deps chromium
      if: inputs.browsers == 'true' && steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      working-directory: e2e
    # The ssh workspace tests start a private sshd on 127.0.0.1 as the CI user, with its own keys.
    # Every job that runs the end-to-end suite needs it, or the ssh tests fail before they begin.
    - run: |
        sudo apt-get update
        sudo apt-get install -y openssh-server
        sudo mkdir -p /run/sshd
      if: inputs.ssh == 'true' && runner.os == 'Linux'
      shell: bash
