name: build
# What each job proves, and how to read a red run: docs/decisions/2026-11-23-ci.md
on:
  push:
    branches: [main, "queue/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # Builds dist/release/darwin-arm64 and darwin-x64 (each about 700 MB with its node_modules).
      - run: bun run build
      # `bash script`, not `./script`: a lost executable bit in git must not break the build.
      - name: Build the app and an unsigned dmg for each architecture
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            swift_arch=$([ "$arch" = x64 ] && echo x86_64 || echo arm64)
            (cd packages/mac && swift build -c release --arch "$swift_arch")
            bash scripts/mac/make-app.sh "$arch"
            # No secrets here: nested native code, binaries and bundle are ad-hoc signed.
            bash scripts/mac/sign-and-notarize.sh "$arch"
            df -h . | tail -1
          done
      - name: The ad-hoc signature is valid, nested native code included
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            app="dist/app-$arch/AgentControl.app"
            codesign -dv --verbose=2 "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            # Every native addon and library inside is signed on its own, and there are some.
            nested=0
            while IFS= read -r -d '' file; do
              codesign --verify --strict "$file"
              nested=$((nested + 1))
            done < <(find "$app/Contents/Resources" -type f \( -name '*.node' -o -name '*.dylib' \) -print0)
            echo "$arch: $nested nested native files verified"
            test "$nested" -gt 0
            for file in MacOS/AgentControlMenu Resources/agentcontrol Resources/agentcontrol-relay; do
              test -x "$app/Contents/$file"
            done
          done
      # Only the runner's own architecture can run here (the x64 app needs Rosetta on arm64).
      - name: Smoke test the compiled app inside the bundle
        run: |
          arch=$([ "$(uname -m)" = arm64 ] && echo arm64 || echo x64)
          bun scripts/smoke-binary.ts --app "dist/app-$arch/AgentControl.app/Contents/Resources"
      # The unsigned dmg is the shipped artifact: open it and run what is inside, as a user would.
      - name: The dmg mounts, and the app inside it runs
        run: |
          set -euo pipefail
          native=$([ "$(uname -m)" = arm64 ] && echo arm64 || echo x64)
          for dmg in dist/AgentControl-*.dmg; do
            hdiutil verify "$dmg"
            mount="$(mktemp -d)"
            hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
            test -x "$mount/AgentControl.app/Contents/MacOS/AgentControlMenu"
            codesign --verify --deep --strict "$mount/AgentControl.app"
            case "$dmg" in
              *"-$native.dmg")
                bun scripts/smoke-binary.ts --app "$mount/AgentControl.app/Contents/Resources" ;;
            esac
            hdiutil detach "$mount"
          done
      - name: Checksums of the release folders, and the size of what ships
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            (cd "dist/release/darwin-$arch" && find . -type f -print0 | sort -z \
              | xargs -0 shasum -a 256) > "dist/release-darwin-$arch.sha256"
          done
          {
            echo "### Sizes"
            ls -l dist/*.dmg | awk '{ printf "%s: %.0f MB\n\n", $NF, $5 / 1048576 }'
            du -sm dist/release/* | awk '{ printf "%s: %s MB (unpacked)\n\n", $2, $1 }'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agentcontrol-mac
          path: |
            dist/*.dmg
            dist/release-darwin-*.sha256
            dist/manifest.json
          # The dmgs are compressed already.
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

  linux-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: bun run build:relay-linux-x64
      - run: bun scripts/smoke-binary.ts dist/agentcontrol-relay-linux-x64
      # The whole compiled app, run from a clean copy with no source tree and no bun on PATH.
      - run: bun run build:linux
      - run: bun scripts/smoke-binary.ts --app dist/release/linux-x64
