name: build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Build the app and an unsigned dmg for each architecture
        run: |
          set -euo pipefail
          for arch in arm64 x64; do
            swift_arch=$([ "$arch" = x64 ] && echo x86_64 || echo arm64)
            (cd packages/mac && swift build -c release --arch "$swift_arch")
            scripts/mac/make-app.sh "$arch"
            # No secrets here, so this is an ad-hoc signed dmg for testing.
            scripts/mac/sign-and-notarize.sh "$arch"
          done
      # TODO: pin this action to a commit SHA like the others (Dependabot can do it).
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: agentcontrol-mac
          path: |
            dist/*.dmg
            dist/agentcontrol-*
            dist/manifest.json
          if-no-files-found: error

  linux-relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build:relay-linux-x64
      - run: bun scripts/smoke-binary.ts dist/agentcontrol-relay-linux-x64
