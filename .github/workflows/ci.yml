name: ci
# scripts/integrate.ts runs the full check before it lands anything on main, so CI on main is the
# second opinion on a clean machine. queue/** branches can be pushed by hand to try a candidate.
# There are no pull requests, so there is no pull_request trigger.
on:
  push:
    branches: [main, "queue/**"]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: a red commit must always report back.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The audit needs the network and the advisory feed, so it runs in audit.yml instead.
      CHECK_SKIP: audit
      # The coverage gate holds the lines added since the tip before this push to 95%.
      COVERAGE_BASE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The coverage gate compares the lines this change adds with origin/main.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.cache
          key: tools-${{ runner.os }}-${{ hashFiles('bun.lock', 'eslint.config.js', 'tsconfig*.json') }}
          restore-keys: tools-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The browser tests of the default UI drive a real Chromium.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}
      - run: bunx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: bunx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      - name: Git identity for the tests that create repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      # `check` runs the end-to-end suite once, through the coverage gate (test:coverage).
      - run: bun run check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/summary.json
          if-no-files-found: ignore

  # Nightly: the covered lines must be identical run to run, or a code path depends on timing.
  coverage-stable:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The browser tests of the default UI drive a real Chromium.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package.json') }}
      - run: bunx playwright install --with-deps chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: bunx playwright install-deps chromium
        if: steps.browsers.outputs.cache-hit == 'true'
      - name: Git identity for the tests that create repositories
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          git config --global init.defaultBranch main
      - run: bun run test:coverage-stable

  prove-gates:
    # Feeds every gate a deliberately bad sample and fails if one passes, so a gate that silently
    # stops working is caught on the next push.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run prove-gates

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
